name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows PowerShell 5.1
            shell: powershell
            id: ps51
          - name: PowerShell 7
            shell: pwsh
            id: ps7

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Show PowerShell version
        shell: ${{ matrix.shell }}
        run: $PSVersionTable | Format-Table -AutoSize

      - name: Install Pester 5 and PSScriptAnalyzer
        shell: ${{ matrix.shell }}
        run: ./build.ps1 -Task Bootstrap

      - name: PSScriptAnalyzer
        shell: ${{ matrix.shell }}
        run: ./build.ps1 -Task Analyze

      - name: Pester
        shell: ${{ matrix.shell }}
        run: ./build.ps1 -Task Test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.id }}
          path: TestResults/
          if-no-files-found: ignore
