name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows PowerShell 5.1
            exe: powershell
            id: ps51
          - name: PowerShell 7
            exe: pwsh
            id: ps7

    # Steps run in pwsh; build.ps1 is started in a separate process with the PowerShell
    # edition under test (matrix.exe), because `shell:` cannot take a matrix value.
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Show PowerShell version
        run: |
          & ${{ matrix.exe }} -NoProfile -Command '$PSVersionTable | Format-Table -AutoSize'
          exit $LASTEXITCODE

      - name: Install Pester 5 and PSScriptAnalyzer
        run: |
          & ${{ matrix.exe }} -NoProfile -ExecutionPolicy Bypass -File ./build.ps1 -Task Bootstrap
          exit $LASTEXITCODE

      - name: PSScriptAnalyzer
        run: |
          & ${{ matrix.exe }} -NoProfile -ExecutionPolicy Bypass -File ./build.ps1 -Task Analyze
          exit $LASTEXITCODE

      - name: Pester
        run: |
          & ${{ matrix.exe }} -NoProfile -ExecutionPolicy Bypass -File ./build.ps1 -Task Test
          exit $LASTEXITCODE

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.id }}
          path: TestResults/
          if-no-files-found: ignore
